<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Easy Chanaa</title>
<meta name="description" content="Easy Chanaa clothing. See the pieces worn, then order on WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Bebas+Neue&display=swap">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/socials.css">
</head>
<body>

<div class="wrap">
  <header class="top">
    <a class="mark" href="#top"><img src="Designs%20%26%20Shxt/03-easy-chanaa-wordmark-cropped.png" alt="Easy Chanaa"></a>
    <a class="btn" href="https://wa.me/27726777608" target="_blank" rel="noopener">Order on WhatsApp</a>
  </header>
</div>

<main id="top">
  <div class="wrap">
    <div class="hero">
      <div class="hero-copy">
        <h1><img class="brand-wordmark" src="Designs%20%26%20Shxt/03-easy-chanaa-wordmark-cropped.png" alt="Easy Chanaa"></h1>
        <p id="tagline">Ke Sure Case Story</p>
        <div class="cta">
          <a class="btn" href="#products">Shop pieces</a>
        </div>
      </div>
      <div class="shot" id="heroShot"><span class="slot">Hero photo goes here</span></div>
    </div>
  </div>

  <section id="products">
    <div class="wrap">
      <h2>Pieces</h2>
      <div class="grid" id="productGrid"></div>
    </div>
  </section>
</main>

<footer class="socials" id="follow">
  <div class="wrap">
    <h2>Follow us</h2>
    <div class="socials__links">
      <a class="btn" href="https://www.instagram.com/easychanaa/" target="_blank" rel="noopener">Instagram</a>
      <a class="btn ghost" href="https://wa.me/27726777608" target="_blank" rel="noopener">WhatsApp</a>
    </div>
  </div>
</footer>

<dialog id="productModal" class="modal" aria-labelledby="pmTitle">
  <button type="button" class="modal__close" id="pmClose" aria-label="Close">&times;</button>
  <div class="modal__body">
    <div class="stage">
      <div class="gallery" id="pmGallery"></div>
      <div class="stage3d" id="pm3d" hidden></div>
    </div>
    <div class="modal__info">
      <h2 id="pmTitle"></h2>
      <p class="modal__price" id="pmPrice"></p>
      <div class="modal__actions">
        <a class="btn" id="pmOrder" href="#" target="_blank" rel="noopener">Order on WhatsApp</a>
        <button type="button" class="btn ghost" id="pmToggle3d" hidden>View in 3D</button>
      </div>
    </div>
  </div>
</dialog>

<script type="module" src="js/main.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Easy Chanaa</title>
<meta name="description" content="Easy Chanaa clothing. See the pieces worn, then order on WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Bebas+Neue&display=swap">
<style>
:root{
  --bg:#EDEFEA; --fg:#14201B; --muted:#55615B; --line:#CBD1CA; --tile:#DDE2DB;
  --accent:#2438C8; --accent-fg:#FFFFFF; --focus:#2438C8;
  --font:"Archivo","Helvetica Neue",Arial,sans-serif;
  --display:"Bebas Neue","Arial Narrow","Roboto Condensed",Impact,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101612; --fg:#E9EEE8; --muted:#A3AFA8; --line:#2B3630; --tile:#1B2420;
  --accent:#8EA0FF; --accent-fg:#0B1033; --focus:#8EA0FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101612; --fg:#E9EEE8; --muted:#A3AFA8; --line:#2B3630; --tile:#1B2420;
  --accent:#8EA0FF; --accent-fg:#0B1033; --focus:#8EA0FF; color-scheme:dark}

*{box-sizing:border-box}
html{color-scheme:light dark;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:0}
.wrap{max-width:1080px;margin-inline:auto}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.02}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.skip{position:absolute;left:-999px}.skip:focus{left:16px;top:8px;background:var(--bg);padding:8px;z-index:9}

/* Display type — condensed block lettering inspired by the Easy Chanaa watermark */
.display,.mark,h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.015em;text-transform:uppercase;line-height:.9}
.display{font-size:1.05em}

/* Scroll reveal */
.reveal{opacity:0;transform:translateY(14px);transition:opacity .7s cubic-bezier(.2,.8,.2,1),transform .7s cubic-bezier(.2,.8,.2,1)}
.reveal.is-visible{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .reveal{opacity:1;transform:none;transition:none}
}

header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);z-index:5}
.mark{display:inline-flex;align-items:center;text-decoration:none;line-height:0}.mark img{display:block;width:clamp(132px,18vw,190px);height:auto}.brand-wordmark{display:block;width:min(100%,720px);height:auto}.brand-wordmark-wrap{display:block;width:min(100%,720px);line-height:0}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 20px;border-radius:999px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-fg);font:700 15px var(--font);text-decoration:none;cursor:pointer;transition:transform .2s ease,background .2s ease,color .2s ease}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--fg)}
.btn.ghost:hover{background:var(--fg);color:var(--bg)}

.hero{display:grid;gap:24px;padding-block:32px 48px}
.hero h1{font-size:clamp(4rem,17vw,10.5rem);letter-spacing:.01em;line-height:.78;max-width:720px;width:100%}
.hero p{max-width:34ch;margin:0;color:var(--muted);font-size:18px}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px}
.shot{position:relative;background:var(--tile);overflow:hidden;aspect-ratio:4/5;display:grid;place-items:end start;border-radius:14px}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.2,.8,.2,1),filter .6s ease}
.shot .slot{padding:12px;font-size:13px;color:var(--muted);position:relative;z-index:1}
.shot--hover:hover img{transform:scale(1.05)}
.shot--hover::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.28),transparent 55%);opacity:0;transition:opacity .45s ease;pointer-events:none}
.shot--hover:hover::after{opacity:1}
@media(min-width:760px){.hero{grid-template-columns:1.1fr .9fr;align-items:end;padding-block:48px 72px}}

section{padding-block:48px;border-top:1px solid var(--line)}
section>.wrap>h2{font-size:clamp(2.5rem,7vw,4.2rem);letter-spacing:.02em;line-height:.84;margin-bottom:12px}
.lede{color:var(--muted);margin:0 0 28px;max-width:52ch}

/* Story */
.story p{max-width:60ch;margin:0;color:var(--muted);font-size:17px;line-height:1.65}
.story p+p{margin-top:12px}

.worn{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:760px){.worn{grid-template-columns:repeat(4,1fr)}}

.pieces{display:grid;grid-template-columns:repeat(2,1fr);gap:24px 12px}
@media(min-width:760px){.pieces{grid-template-columns:repeat(4,1fr);gap:32px 16px}}
.piece h3{font-size:21px;letter-spacing:.02em;margin:10px 0 2px;line-height:.92}
.piece .meta{margin:0;font-size:14px;color:var(--muted)}
.piece .price{font-weight:700;font-variant-numeric:tabular-nums;color:var(--fg)}
.piece button{margin-top:10px;min-height:44px;width:100%;border:2px solid var(--fg);background:transparent;color:var(--fg);border-radius:999px;font:700 14px var(--font);cursor:pointer;transition:background .2s ease,color .2s ease}
.piece button:hover{background:var(--fg);color:var(--bg)}

form{display:grid;gap:16px;max-width:560px}
label{display:grid;gap:6px;font-weight:600;font-size:15px}
input,select,textarea{font:400 16px var(--font);color:var(--fg);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:12px;min-height:48px;width:100%}
textarea{min-height:88px;resize:vertical}
.row{display:grid;gap:16px}
@media(min-width:560px){.row{grid-template-columns:1fr 1fr}}
.result{margin-top:24px;max-width:560px;border:2px solid var(--fg);border-radius:12px;padding:16px;display:grid;gap:12px}
.result pre{margin:0;white-space:pre-wrap;word-break:break-word;font:400 15px/1.5 var(--font)}
.result .acts{display:flex;flex-wrap:wrap;gap:10px}
.note{font-size:14px;color:var(--muted);margin:0}
.err{color:var(--fg);font-weight:600;font-size:14px;margin:0}

.stock{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:560px){.stock{grid-template-columns:1fr 1fr}}
.stock div{border-top:2px solid var(--fg);padding-top:12px}
.stock h3{font-size:25px;letter-spacing:.02em}
.stock p{margin:4px 0 0;color:var(--muted)}
footer{padding-block:32px 48px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
[hidden]{display:none!important}

/* ---------- 360 spinner ---------- */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.spin360{position:relative;aspect-ratio:4/5;background:var(--tile);border-radius:14px;overflow:hidden;cursor:grab;touch-action:pan-y;user-select:none;-webkit-tap-highlight-color:transparent;opacity:0;transform:translateY(12px) scale(.98);transition:opacity .7s cubic-bezier(.2,.8,.2,1),transform .7s cubic-bezier(.2,.8,.2,1);outline-offset:4px}
.spin360.is-visible{opacity:1;transform:none}
.spin360.is-active{cursor:grabbing}
.spin360:focus-visible{outline:3px solid var(--focus)}
.spin360__stage{position:absolute;inset:0;overflow:hidden}
.spin360__img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none;transition:transform .5s cubic-bezier(.2,.8,.2,1);will-change:transform}
.spin360.is-zoomed .spin360__img{transition:none}
.spin360__loader{position:absolute;inset:0;display:grid;place-items:center;background:var(--tile);transition:opacity .5s ease,visibility .5s}
.spin360.is-ready .spin360__loader{opacity:0;visibility:hidden;pointer-events:none}
.spin360__ring{width:44px;height:44px;transform:rotate(-90deg)}
.spin360__track{fill:none;stroke:var(--line);stroke-width:2.5}
.spin360__prog{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:94.2;stroke-dashoffset:94.2;transition:stroke-dashoffset .35s ease}
.spin360__ui{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:flex-end;padding:14px;pointer-events:none}
.spin360__hint,.spin360__counter{padding:6px 12px;border-radius:999px;background:color-mix(in srgb,var(--fg) 72%,transparent);color:var(--bg);font:600 12px var(--font);letter-spacing:.02em;backdrop-filter:blur(6px);opacity:0;transform:translateY(6px);transition:opacity .35s ease,transform .35s ease}
.spin360__hint{animation:hintPulse 2.4s ease-in-out infinite}
.spin360__counter{font-variant-numeric:tabular-nums}
.spin360__counter-n{display:inline-block;min-width:1.6ch;text-align:right}
@keyframes hintPulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.spin360:hover .spin360__hint,.spin360:hover .spin360__counter,.spin360:focus-visible .spin360__hint,.spin360:focus-visible .spin360__counter,.spin360.is-active .spin360__hint,.spin360.is-active .spin360__counter{opacity:1;transform:translateY(0)}
.spin360.is-dragged .spin360__hint{opacity:0;transform:translateY(6px);animation:none}
@media (prefers-reduced-motion:reduce){
  .spin360{cursor:default;opacity:1;transform:none;transition:none}
  .spin360__hint{display:none}
  .spin360__img{transition:none}
  .spin360__ui{opacity:1}
  .spin360__counter{opacity:1;transform:none}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <a class="mark" href="#top"><img src="Designs%20%26%20Shxt/03-easy-chanaa-wordmark-cropped.png" alt="Easy Chanaa"></a>
    <a class="btn" id="hdrWa" href="https://wa.me/27726777608" target="_blank" rel="noopener">Order on WhatsApp</a>
  </header>
</div>

<main id="top">
  <div class="wrap">
    <div class="hero">
      <div style="display:grid;gap:24px">
        <h1 class="brand-wordmark-wrap"><img class="brand-wordmark" src="Designs%20%26%20Shxt/03-easy-chanaa-wordmark-cropped.png" alt="Easy Chanaa"></h1>
        <p id="tagline" style="max-width:none;text-align:center;font-size:clamp(1.75rem,6vw,3rem);line-height:1.1">Ke Sure Case Story</p>
        <div class="cta">
          <a class="btn" href="https://wa.me/27726777608" target="_blank" rel="noopener">Order a piece</a>
        </div>
      </div>
      <div class="shot" id="heroShot"><span class="slot">Hero photo goes here</span></div>
    </div>
  </div>
</main>

<script>
const heroPhoto = "easy-chanaa-shorts-grade-05-watermarked.jpg";
if(heroPhoto){ document.getElementById("heroShot").replaceChildren(Object.assign(document.createElement("img"), {src:heroPhoto, alt:"Easy Chanaa piece being worn", fetchPriority:"high"})); }
</script>
</body>
</html>
